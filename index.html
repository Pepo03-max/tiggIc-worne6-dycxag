<script>
App.start();
if('serviceWorker'in navigator&&location.protocol!=='file:'){
  let registration=null,controller=navigator.serviceWorker.controller,reloading=false;
  const checkForUpdate=()=>{if(registration)registration.update().catch(()=>{})};
  const reloadForUpdate=()=>{
    if(reloading)return;
    if(App.active){App.pendingServiceWorkerReload=true;return}
    reloading=true;
    location.reload()
  };
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    const nextController=navigator.serviceWorker.controller;
    if(!controller){controller=nextController;return}
    if(nextController===controller)return;
    controller=nextController;
    reloadForUpdate()
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')checkForUpdate()
  });
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=57',{updateViaCache:'none'})
    .then(value=>{registration=value;checkForUpdate()})
    .catch(()=>{}),{once:true})
}
</script>
