<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mente Activa | Generador de iconos</title><body style="font:16px system-ui;text-align:center;padding:30px"><h1>Mente Activa | Generador de iconos</h1><p>Download optional PNG icons.</p><div id="buttons"></div><script>const sizes=[180,192,512];function draw(size){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),s=size/512;x.fillStyle='#4f6df5';x.beginPath();x.roundRect(0,0,size,size,110*s);x.fill();x.fillStyle='#fff';x.globalAlpha=.95;x.beginPath();x.arc(200*s,210*s,95*s,0,7);x.fill();x.globalAlpha=.55;x.beginPath();x.arc(318*s,300*s,95*s,0,7);x.fill();return c}for(const size of sizes){const b=document.createElement('button');b.textContent='Download icon-'+size+'.png';b.style='display:block;margin:12px auto;padding:12px';b.onclick=()=>{const a=document.createElement('a');a.download='icon-'+size+'.png';a.href=draw(size).toDataURL('image/png');a.click()};buttons.append(b)}</script>
